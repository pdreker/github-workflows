name: PR title

# Repositories squash-merge, so the PR title becomes the commit on main that
# release-please reads. Enforce Conventional Commits on the title, not on the commits
# of the branch.
#
# Caller trigger: pull_request with types [opened, edited, reopened, synchronize].
# Caller permissions: pull-requests: read.

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
