name: Test

# Every change here reaches all calling repositories, so pull requests (including
# Renovate's action bumps) run each reusable workflow against tests/fixture first.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install tools
        run: uv sync --locked --all-groups
      - name: actionlint
        run: uv run actionlint
      - name: zizmor
        if: ${{ !cancelled() }}
        run: uv run zizmor --offline .github/workflows

  python-ci:
    uses: ./.github/workflows/python-ci.yaml
    with:
      working-directory: tests/fixture

  docker-image:
    uses: ./.github/workflows/docker-image.yaml
    with:
      image: fixture.invalid/fixture
      context: tests/fixture
      push: false
