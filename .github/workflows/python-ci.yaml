name: Python CI

# Lint, format check, type check and tests for a uv project. Settings for ruff, ty and
# pytest come from the caller's pyproject.toml; templates/pyproject-tools.toml is the
# shared starting point.
#
# Caller permissions: contents: read; plus packages: read when the Dockerfile takes a
# private image from GHCR (the test build logs in there with GITHUB_TOKEN); plus
# pull-requests: read with pr-title.
#
# One job on purpose: GitHub bills every job rounded up to a full minute, so a second
# job of a few seconds (title check, image smoke test) costs a whole extra minute.

on:
  workflow_call:
    inputs:
      pr-title:
        description: >-
          Check the pull request title against Conventional Commits (squash merges make it
          the commit release-please reads). A title edit must rerun the whole job, so it
          never turns an earlier red result green: callers add a second workflow on
          pull_request [edited] with the same job name and
          `if: github.event.changes.title != null` (see README).
        type: boolean
        default: false
      python-version:
        description: Python version for uv to install; empty takes the repository's .python-version
        type: string
        default: ""
      working-directory:
        description: Directory that holds pyproject.toml
        type: string
        default: "."
      fetch-depth:
        description: Commits to fetch; 0 for full history (Sonar needs it)
        type: number
        default: 1
      pytest:
        description: Run pytest
        type: boolean
        default: true
      extra-run:
        description: Extra shell command after the tests, e.g. "uv run mkdocs build --strict"
        type: string
        default: ""
      image-smoke:
        description: >-
          Arguments for a smoke run of the test image (docker run --rm <image> <args>),
          e.g. "--version"; empty skips it
        type: string
        default: ""
      sonar:
        description: Run a SonarQube Cloud scan after the tests (needs secret sonar-token)
        type: boolean
        default: false
    secrets:
      sonar-token:
        required: false

# No permissions block: a called workflow can only narrow the caller's rights, and the
# test build needs packages: read for a private image from GHCR while every other
# project does not. The caller job sets them.

jobs:
  ci:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Exact uv: without it every run installs the newest uv, with no PR and no cooling-off.
          version: "0.13.8"
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Install dependencies
        id: sync
        # --locked: fail when uv.lock no longer matches pyproject.toml.
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: Type check (ty)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ty check
      # For a Dockerfile that takes a private image from GHCR (FROM or COPY --from), and for
      # an extra-run that pulls one. Before the tests so both can use it. The
      # token reads such a package only if the caller job has packages: read and the
      # package grants the repository access; public images need neither.
      - name: Log in to GHCR
        if: ${{ !cancelled() && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.pytest }}
        run: uv run pytest
      - name: Extra command
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.extra-run != '' }}
        env:
          EXTRA_RUN: ${{ inputs.extra-run }}
        run: bash -euo pipefail -c "$EXTRA_RUN"
      # Build the image once as a test (one platform, no push) when the project has a
      # Dockerfile: the multi-platform build runs only on main, so a base image that breaks
      # the build (e.g. no wheels for a new Python) would otherwise show up after the merge.
      - name: Set up Docker Buildx
        if: ${{ !cancelled() && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (test, linux/amd64, no push)
        if: ${{ !cancelled() && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          platforms: linux/amd64
          push: false
          load: ${{ inputs.image-smoke != '' }}
          tags: python-ci:test
          # Read the cache of the main/release build too: CI no longer runs on main, so
          # without it a new pull request would never find a cache it may read.
          cache-from: |
            type=gha,scope=test
            type=gha,scope=image
          cache-to: type=gha,scope=test,mode=max
      - name: Image smoke run
        if: ${{ !cancelled() && inputs.image-smoke != '' && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != '' }}
        env:
          IMAGE_SMOKE: ${{ inputs.image-smoke }}
        # IMAGE_SMOKE holds the arguments, split at whitespace.
        run: |
          read -ra args <<< "$IMAGE_SMOKE"
          docker run --rm python-ci:test "${args[@]}"
      # Last, so a bad title does not skip the other checks.
      - name: Conventional PR title
        if: ${{ !cancelled() && inputs.pr-title && github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: SonarQube Cloud scan
        # Only after all checks passed. Secrets are not passed to pull requests from
        # forks; skip the scan there.
        if: >-
          ${{ success() && inputs.sonar &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
