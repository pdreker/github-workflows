# Shared starting point for Python tooling. Copy these tables into pyproject.toml.
#
# ruff cannot load settings from another repository (`extend` takes local paths
# only), so every repository carries its own copy. Deviations are fine, but each one
# gets a comment saying why: add rules with `extend-select`, drop them with `ignore`
# or `per-file-ignores`.
#
# ruff takes the target Python version from `requires-python`; no `target-version`.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "C90", "I", "N", "UP", "YTT", "ANN", "ASYNC", "S", "BLE", "FBT", "B",
  "A", "COM", "C4", "DTZ", "T10", "EM", "FA", "ISC", "G", "INP", "PIE", "T20", "PT", "Q",
  "RSE", "RET", "SLF", "SLOT", "SIM", "INT", "ARG", "PTH", "TD", "FIX", "PGH", "PL", "TRY",
  "FLY", "PERF", "FURB", "LOG", "RUF",
]
ignore = [
  "E203",   # whitespace before ':', conflicts with the formatter
  "COM812", # trailing comma, conflicts with the formatter
  "ISC001", # implicit string concatenation, conflicts with the formatter
  "ANN204", # return type of __init__ and other special methods
]

[tool.ruff.lint.per-file-ignores]
# Tests are linted like the rest; only rules that make no sense there are off.
"tests/**" = [
  "S101",    # assert is how pytest checks
  "PLR2004", # expected values are literals
  "INP001",  # tests/ needs no __init__.py
]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Cooling-off period: uv only resolves releases older than a week.
exclude-newer = "1 week"
